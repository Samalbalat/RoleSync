name: Build, Tag and Deploy

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - backend-develop

jobs:
  build-tag-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Build JAR
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 3. Generate version
      - name: Generate version
        id: version
        run: echo "VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rolesync:${{ steps.version.outputs.VERSION }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/rolesync:${{ steps.version.outputs.VERSION }} \
                     ${{ secrets.DOCKER_USERNAME }}/rolesync:latest

      # 6. Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/rolesync:${{ steps.version.outputs.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/rolesync:latest

      # 7. Create Git tag (AFTER success)
      - name: Create Git tag
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a $VERSION -m "Release $VERSION" || echo "Tag exists"
          git push origin $VERSION || echo "Tag already pushed"

      # 8. Trigger Render deploy
      - name: Deploy to Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
